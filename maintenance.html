<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friendly Ride — Site Undergoing Maintenance</title>
<meta name="description" content="Friendly Ride's website is briefly undergoing scheduled maintenance. Reservations and dispatch remain available by phone, 24 hours a day.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0B0A08;
    color: #F3EEE3;
    font-family: 'Jost', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #A8895C; color: #0B0A08; }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(900px 520px at 50% 20%, rgba(168,137,92,.14) 0%, rgba(168,137,92,0) 70%);
    pointer-events: none;
  }
  .mark {
    height: 56px;
    margin-bottom: 28px;
    mix-blend-mode: screen;
    position: relative;
  }
  .wordmark {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 15px;
    letter-spacing: .32em;
    font-weight: 500;
    color: #C9BFAF;
    margin-bottom: 46px;
    position: relative;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .34em;
    color: #A8895C;
    text-transform: uppercase;
    font-weight: 500;
    position: relative;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(32px, 5vw, 50px);
    line-height: 1.12;
    margin: 20px 0 22px;
    max-width: 680px;
    text-wrap: balance;
    position: relative;
  }
  p {
    font-size: 16px;
    font-weight: 300;
    line-height: 1.75;
    color: #C6BCAC;
    max-width: 520px;
    margin: 0 auto;
    position: relative;
  }
  .rule {
    width: 64px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(168,137,92,.7), transparent);
    margin: 40px auto;
    position: relative;
  }
  .contact {
    font-size: 12.5px;
    letter-spacing: .1em;
    color: #877D6E;
    position: relative;
  }
  .contact a {
    color: #C9BFAF;
    text-decoration: none;
    border-bottom: 1px solid rgba(168,137,92,.4);
    padding-bottom: 2px;
    transition: color .3s;
  }
  .contact a:hover { color: #A8895C; }
  .hours {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: .22em;
    color: #6E6455;
    text-transform: uppercase;
    position: relative;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="eyebrow">Friendly Ride</div>
  <h1>We&rsquo;re making a few improvements. Back shortly.</h1>
  <p>Our website is briefly offline for scheduled maintenance. Reservations, dispatch and your account remain fully available by phone, 24 hours a day.</p>
  <div class="rule"></div>
  <div class="contact">Call or text <a href="tel:8773741122">877-374-1122</a> &nbsp;&middot;&nbsp; Office <a href="tel:7185455466">718-545-5466</a></div>
  <div class="hours">24 Hours a Day &nbsp;&middot;&nbsp; 365 Days a Year</div>
</div>
</body>
</html>
